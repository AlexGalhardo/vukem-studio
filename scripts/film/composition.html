<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Vukem film composition</title>
<style>
@font-face{font-family:Geist;src:url('/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')}
body{margin:0;background:#07090d}
canvas{display:block;width:100vw;height:100vh}
</style>
<canvas></canvas>
<script>
const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");
let shots = [];
let tokens = {};
let images = {};
let portrait = false;
let total = 120;

const shotKinds = ["dashboard", "transactions", "accounts", "login", "workspace", "landing"];

function sceneSeconds(scene) {
  const value = Number(scene.seconds);
  return value > 0 ? value : 8;
}

function schedule(list) {
  let cursor = 0;
  return list.map((scene) => {
    const seconds = sceneSeconds(scene);
    const start = cursor;
    cursor += seconds;
    return { ...scene, start, seconds };
  });
}

window.prepare = async function (format) {
  portrait = format === "vertical";
  canvas.width = portrait ? 1080 : 1920;
  canvas.height = portrait ? 1920 : 1080;
  const raw = await (await fetch("/scripts/film/scenes.json")).json();
  shots = schedule(raw);
  total = shots.reduce((sum, scene) => sum + scene.seconds, 0);
  tokens = (await (await fetch("/films/vukem-launch/art-direction.json")).json()).palette;
  await document.fonts.load("700 60px Geist");
  const names = new Set();
  for (const scene of shots) {
    if (scene.image) names.add(scene.image);
    else if (shotKinds.includes(scene.kind)) names.add(scene.kind);
  }
  await Promise.all([...names].map(async (name) => {
    const image = new Image();
    const file = name.includes("/")
      ? name
      : "/films/vukem-launch/assets/" + name + "-" + format + ".png";
    image.src = file;
    await image.decode();
    images[name] = image;
  }));
  return { total, count: shots.length };
};

function text(value, x, y, size, color, weight) {
  ctx.fillStyle = color || tokens.text;
  ctx.font = (weight || 650) + " " + size + "px Geist";
  String(value).split("\n").forEach((line, index) => {
    ctx.fillText(line, x, y + index * size * 1.08);
  });
}

function wrap(value, maxWidth, size) {
  ctx.font = "450 " + size + "px Geist";
  const lines = [];
  for (const paragraph of String(value).split("\n")) {
    if (paragraph === "") {
      lines.push("");
      continue;
    }
    let line = "";
    for (const word of paragraph.split(" ")) {
      const next = line ? line + " " + word : word;
      if (ctx.measureText(next).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = next;
      }
    }
    if (line) lines.push(line);
  }
  return lines;
}

function panel(x, y, w, h, label, body, size) {
  ctx.fillStyle = tokens.surface;
  ctx.fillRect(x, y, w, h);
  text(label, x + 36, y + 52, 23, tokens.muted, 400);
  const lines = wrap(body, w - 80, size);
  const visible = lines.slice(0, Math.floor((h - 110) / (size * 1.15)));
  visible.forEach((line, index) => {
    text(line, x + 40, y + 120 + index * size * 1.15, size, tokens.primary, 450);
  });
}

window.draw = function (t) {
  const clamped = Math.max(0, Math.min(t, Math.max(total - 0.001, 0)));
  let scene = shots[shots.length - 1];
  let index = shots.length - 1;
  for (let i = 0; i < shots.length; i++) {
    if (clamped < shots[i].start + shots[i].seconds) {
      scene = shots[i];
      index = i;
      break;
    }
  }
  const local = clamped - scene.start;
  const width = canvas.width;
  const height = canvas.height;
  const fade = Math.min(1, local * 2, (scene.seconds - local) * 3);
  ctx.globalAlpha = 1;
  ctx.fillStyle = tokens.background;
  ctx.fillRect(0, 0, width, height);
  ctx.strokeStyle = tokens.grid;
  ctx.lineWidth = 1;
  for (let x = 0; x < width; x += 80) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
  }
  for (let y = 0; y < height; y += 80) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 0.4;
  ctx.strokeStyle = tokens.primary;
  ctx.beginPath();
  for (let x = 0; x < width; x += 10) {
    ctx.lineTo(x, height * 0.86 + Math.sin(x / 160 + t * 0.6) * 28);
  }
  ctx.stroke();
  ctx.globalAlpha = fade;
  const margin = portrait ? 88 : 110;
  text("VUKEM", margin, portrait ? 150 : 100, 30, tokens.primary, 700);
  text(
    String(index + 1).padStart(2, "0") + " / " + String(shots.length).padStart(2, "0"),
    portrait ? 760 : 1640,
    portrait ? 150 : 100,
    23,
    tokens.muted,
    400,
  );
  const shift = 30 * Math.pow(1 - Math.min(1, local * 1.4), 3);
  ctx.save();
  ctx.translate(0, shift);
  const shot = images[scene.image || scene.kind];
  const titleSize = portrait ? 68 : shot ? 60 : 92;
  const titleY = portrait ? 280 : shot ? 250 : 420;
  text(scene.title, margin, titleY, titleSize);
  const titleLines = String(scene.title).split("\n").length;
  const subY = titleY + titleLines * titleSize * 1.08 + 36;
  if (scene.kind === "terminal" || scene.kind === "code") {
    const typed = (scene.code || scene.sub).slice(0, Math.floor(Math.max(0, local - 0.35) * 42));
    if (portrait) {
      panel(72, 620, 936, 1100, scene.kind === "code" ? "●  ●  ●     source" : "●  ●  ●     terminal", typed, 32);
    } else {
      text(scene.sub, margin, subY, 30, tokens.secondaryText, 400);
      panel(margin, 520, 1680, 420, scene.kind === "code" ? "●  ●  ●     source" : "●  ●  ●     terminal", typed, 34);
    }
  } else {
    text(scene.sub, margin, subY, portrait ? 32 : 30, tokens.secondaryText, 400);
  }
  if (shot) {
    // Vertical is its own layout: the mobile capture sits in the lower frame.
    // Horizontal keeps the capture on the right. Neither path crops the other master.
    const bounds = portrait
      ? { maxW: 900, maxH: 1180, x: 90, y: 620 }
      : { maxW: 860, maxH: 620, x: 980, y: 200 };
    const fit = Math.min(bounds.maxW / shot.width, bounds.maxH / shot.height);
    const boxW = shot.width * fit;
    const boxH = shot.height * fit;
    const boxX = portrait ? (width - boxW) / 2 : bounds.x;
    const boxY = bounds.y;
    ctx.fillStyle = tokens.surface;
    ctx.fillRect(boxX - 16, boxY - 16, boxW + 32, boxH + 32);
    ctx.save();
    ctx.beginPath();
    ctx.rect(boxX, boxY, boxW, boxH);
    ctx.clip();
    ctx.drawImage(shot, boxX, boxY, boxW, boxH);
    ctx.restore();
    text("EXAMPLE APP · LOCAL DEMO DATA", boxX, boxY + boxH + 42, portrait ? 20 : 18, tokens.muted, 400);
  }
  ctx.restore();
  ctx.fillStyle = tokens.primary;
  ctx.fillRect(0, height - 6, width * (clamped / total), 6);
  ctx.globalAlpha = 1;
  return canvas.toDataURL("image/jpeg", 0.92).split(",")[1];
};
</script>
</html>
