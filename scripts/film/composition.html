<!doctype html><html lang="en"><meta charset="utf-8"><title>Vukem film composition</title><style>@font-face{font-family:Geist;src:url('/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')}body{margin:0;background:#07090d}canvas{display:block;width:100vw;height:100vh}</style><canvas></canvas><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let shots,images={},portrait=false;
window.prepare=async function(format){portrait=format==='vertical';c.width=portrait?1080:1920;c.height=portrait?1920:1080;shots=await(await fetch('/scripts/film/scenes.json')).json();await document.fonts.load('700 60px Geist');for(const k of ['dashboard','transactions','accounts','login']){let i=new Image();i.src='/films/vukem-launch/assets/'+k+'-'+format+'.png';await i.decode();images[k]=i;}return true;};
function text(s,px,y,size,color='#edf1f5',weight=650){x.fillStyle=color;x.font=weight+' '+size+'px Geist';s.split('\n').forEach((l,i)=>x.fillText(l,px,y+i*size*1.08));}
window.draw=function(t){let idx=Math.min(14,Math.floor(t/8)),s=shots[idx],u=t-idx*8,w=c.width,h=c.height,p=portrait;const fade=Math.min(1,u*2,(8-u)*3);x.globalAlpha=1;x.fillStyle='#07090d';x.fillRect(0,0,w,h);x.strokeStyle='#14202b';x.lineWidth=1;for(let a=0;a<w;a+=80){x.beginPath();x.moveTo(a,0);x.lineTo(a,h);x.stroke()}for(let a=0;a<h;a+=80){x.beginPath();x.moveTo(0,a);x.lineTo(w,a);x.stroke()}x.globalAlpha=.4;x.strokeStyle='#38e1ff';x.beginPath();for(let a=0;a<w;a+=10){let y=h*.8+Math.sin(a/160+t*.6)*45;x.lineTo(a,y)}x.stroke();x.globalAlpha=fade;
text('VUKEM',p?100:110,p?165:100,30,'#38e1ff',700);text(String(idx+1).padStart(2,'0')+' / 15',p?790:1640,p?165:100,23,'#8494a7',400);
let shift=30*Math.pow(1-Math.min(1,u*1.4),3);x.save();x.translate(0,shift);const demo=images[s.kind];let titleSize=p?72:demo?64:100;let ty=p?350:demo?290:440;text(s.title,p?100:110,ty,titleSize);let lines=s.title.split('\n').length;let subY=ty+lines*titleSize*1.08+45;
if(s.kind==='terminal'){let bx=p?90:110,by=p?750:560,bw=p?900:1600,bh=p?600:320;x.fillStyle='#111722';x.fillRect(bx,by,bw,bh);text('●  ●  ●     terminal',bx+35,by+50,23,'#8494a7',400);const content=s.code||s.sub;const visible=content.slice(0,Math.floor(Math.max(0,u-.5)*24));text('$ '+visible,bx+40,by+130,p?33:42,'#38e1ff',450);}else{text(s.sub,p?100:110,subY,p?32:30,'#9caabb',400);}
if(demo){let bx=p?95:900,by=p?720:210,bw=p?890:910,bh=p?1000:640;let scale=Math.min(bw/demo.width,bh/demo.height)*(1+.018*Math.min(u,6)/6);x.fillStyle='#111722';x.fillRect(bx-14,by-14,bw+28,bh+28);x.save();x.beginPath();x.rect(bx,by,bw,bh);x.clip();x.drawImage(demo,bx,by,demo.width*scale,demo.height*scale);x.restore();text('FINANCE SCAFFOLD · FICTIONAL DEMO DATA',bx,by+bh+45,p?19:18,'#8494a7',400);}
x.restore();x.fillStyle='#38e1ff';x.fillRect(0,h-5,w*t/120,5);x.globalAlpha=1;return c.toDataURL('image/jpeg',.92).split(',')[1];};
</script></html>
