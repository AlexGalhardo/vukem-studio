	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vukem</title>
	<meta property="csp-nonce" nonce="{{cspNonce}}">

	{{vite "resources/css/app.css" "resources/js/app.tsx"}}

</head>

	{{.Inertia}}
</body>
</html>
