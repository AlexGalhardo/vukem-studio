name: release

# Publishes a GitHub release when a version tag is pushed. Notes come from
# the matching section of CHANGELOG.md. Binary archives, an SBOM, and a
# cosign bundle are added when the application ships a binary. See
# site/content/docs/deployment/releases.mdx.
#
# workflow_dispatch takes the version to publish, because a tag push does not
# always start a run: GitHub creates no push event when more than three tags
# go up in a single push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (vX.Y.Z). The tag must already be pushed."
        required: true

permissions:
  contents: read

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_VERSION:-$REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::not a version tag: $tag"
              exit 1
              ;;
          esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      # The notes come from the default branch: a tag on an older commit (a
      # retroactive or re-published release) predates its own CHANGELOG section.
      - name: Extract changelog notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git show "origin/$DEFAULT_BRANCH:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md"
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' "$RUNNER_TEMP/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
